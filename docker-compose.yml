services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  app:
    build: .
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      ADAPTER: sqlite
      SQLITE_PATH: data/tasks.db
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-40}
    volumes:
      - ./data:/app/data
      - ./audit:/app/audit
      - ./samples:/app/samples:ro
    depends_on:
      - ollama

volumes:
  ollama_data:
